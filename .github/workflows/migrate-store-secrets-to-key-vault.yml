name: One-time Store secret migration to Key Vault

on:
  push:
    branches:
      - codex/azure-private-release-runner
    paths:
      - .github/workflows/migrate-store-secrets-to-key-vault.yml

permissions:
  contents: read

jobs:
  chrome:
    name: Move Chrome credentials
    runs-on: [self-hosted, bck-kv-migration]
    environment: chrome-production
    timeout-minutes: 10
    steps:
      - name: Store Chrome credentials in private Key Vault
        shell: bash
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          az login --identity --allow-no-subscriptions --output none
          az keyvault secret set --vault-name bck-release-kv-daftech --name chrome-client-id --value "$CHROME_CLIENT_ID" --output none
          az keyvault secret set --vault-name bck-release-kv-daftech --name chrome-client-secret --value "$CHROME_CLIENT_SECRET" --output none
          az keyvault secret set --vault-name bck-release-kv-daftech --name chrome-refresh-token --value "$CHROME_REFRESH_TOKEN" --output none
          echo 'Chrome credentials migrated without exposing their values.'

  edge:
    name: Move Edge credentials
    runs-on: [self-hosted, bck-kv-migration]
    environment: edge-production
    timeout-minutes: 10
    steps:
      - name: Store Edge credentials in private Key Vault
        shell: bash
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          expires_on="$(date --utc --date='+1 year' '+%Y-%m-%dT%H:%M:%SZ')"
          az login --identity --allow-no-subscriptions --output none
          az keyvault secret set --vault-name bck-release-kv-daftech --name edge-client-id --value "$EDGE_CLIENT_ID" --output none
          az keyvault secret set --vault-name bck-release-kv-daftech --name edge-api-key --value "$EDGE_API_KEY" --expires "$expires_on" --output none
          echo 'Edge credentials migrated without exposing their values.'
