name: Publish release to browser stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag whose immutable packages will be used
        required: true
        type: string
      chrome_action:
        description: Chrome action
        required: true
        default: preflight
        type: choice
        options:
          - skip
          - preflight
          - upload-only
          - submit-auto
          - submit-staged
          - publish-staged
      edge_action:
        description: Edge action
        required: true
        default: preflight
        type: choice
        options:
          - skip
          - preflight
          - upload-only
          - submit
      edge_certification_notes:
        description: Required when the Edge action is submit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: browser-store-production
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the protected pipeline control plane
        uses: actions/checkout@v7

      - name: Check out the frozen release source separately
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: release-source

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify release identity and Store disclosure contract
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CHROME_ACTION: ${{ inputs.chrome_action }}
        shell: bash
        run: |
          node release-source/scripts/check-release-ref.mjs "$RELEASE_TAG"
          if [[ "$CHROME_ACTION" == "upload-only" || "$CHROME_ACTION" == "submit-auto" || "$CHROME_ACTION" == "submit-staged" ]]; then
            if [[ ! -f release-source/scripts/check-store-metadata.mjs ]]; then
              echo "Release $RELEASE_TAG predates the required Store disclosure contract and cannot be uploaded by this workflow."
              exit 1
            fi
            (
              cd release-source
              node scripts/check-store-metadata.mjs
            )
          fi

      - name: Download and verify the immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          is_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)"
          if [[ "$is_draft" != "false" || "$is_prerelease" != "false" ]]; then
            echo "Release $RELEASE_TAG must be published and non-prerelease before Store deployment."
            exit 1
          fi
          mkdir -p dist/store-release
          gh release download "$RELEASE_TAG" \
            --pattern 'better_captionkeep-*.zip' \
            --pattern 'release-provenance.json' \
            --pattern 'SHA256SUMS.txt' \
            --dir dist/store-release
          (
            cd dist/store-release
            sha256sum --check SHA256SUMS.txt
          )
          node scripts/verify-release-assets.mjs dist/store-release "$RELEASE_TAG"
          provenance_commit="$(node -p 'JSON.parse(require("fs").readFileSync("dist/store-release/release-provenance.json", "utf8")).commit')"
          tag_commit="$(git -C release-source rev-parse HEAD)"
          if [[ "$provenance_commit" != "$tag_commit" ]]; then
            echo "Release provenance commit $provenance_commit does not match tag commit $tag_commit."
            exit 1
          fi

      - name: Preserve the verified release bundle for Store jobs
        uses: actions/upload-artifact@v7
        with:
          name: verified-store-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: dist/store-release

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## Browser Store release plan"
            echo
            echo "- Tag: \`${{ inputs.tag }}\`"
            echo "- Pipeline commit: \`$(git rev-parse HEAD)\`"
            echo "- Frozen source commit: \`$(git -C release-source rev-parse HEAD)\`"
            echo "- Chrome action: \`${{ inputs.chrome_action }}\`"
            echo "- Edge action: \`${{ inputs.edge_action }}\`"
            echo "- Immutable artifacts and Store disclosure contract: verified"
          } >> "$GITHUB_STEP_SUMMARY"

  chrome:
    if: inputs.chrome_action != 'skip'
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: chrome-production
    steps:
      - name: Check out the protected pipeline control plane
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download the verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: verified-store-release-${{ github.run_id }}
          path: dist/store-release

      - name: Run Chrome Store action
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_ACTION: ${{ inputs.chrome_action }}
          CHROME_PACKAGE_PATH: dist/store-release/better_captionkeep-chrome-${{ inputs.tag }}.zip
        shell: bash
        run: |
          CHROME_PACKAGE_PATH="${CHROME_PACKAGE_PATH/-v/-}"
          export CHROME_PACKAGE_PATH
          npm run publish:chrome

      - name: Write Chrome summary
        shell: bash
        run: |
          {
            echo "## Chrome Web Store"
            echo
            echo "- Action completed: \`${{ inputs.chrome_action }}\`"
            if [[ "${{ inputs.chrome_action }}" == "submit-auto" ]]; then
              echo "- Publication mode: public automatically after Google approval"
            elif [[ "${{ inputs.chrome_action }}" == "submit-staged" ]]; then
              echo "- Publication mode: hold after approval until \`publish-staged\` is run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  edge:
    if: inputs.edge_action != 'skip'
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: edge-production
    steps:
      - name: Check out the protected pipeline control plane
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download the verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: verified-store-release-${{ github.run_id }}
          path: dist/store-release

      - name: Run Edge Add-ons action
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_ACTION: ${{ inputs.edge_action }}
          EDGE_CERTIFICATION_NOTES: ${{ inputs.edge_certification_notes }}
          EDGE_PACKAGE_PATH: dist/store-release/better_captionkeep-${{ inputs.tag }}.zip
        shell: bash
        run: |
          EDGE_PACKAGE_PATH="${EDGE_PACKAGE_PATH/-v/-}"
          export EDGE_PACKAGE_PATH
          npm run publish:edge

      - name: Write Edge summary
        shell: bash
        run: |
          {
            echo "## Microsoft Edge Add-ons"
            echo
            echo "- Action completed: \`${{ inputs.edge_action }}\`"
            if [[ "${{ inputs.edge_action }}" == "preflight" ]]; then
              echo "- Limitation: Microsoft exposes no non-mutating product-status endpoint; credentials are proven by the first upload."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
