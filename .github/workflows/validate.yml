name: Validate extension

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject local or sensitive files
        shell: bash
        run: |
          forbidden="$(git ls-files '.captionkeeper.local.env' '*.pem')"
          if [[ -n "$forbidden" ]]; then
            echo "Local or sensitive files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find teams-captions-saver -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          node --check scripts/check-extension.mjs

      - name: Validate extension structure
        run: npm run lint

      - name: Build extension package
        run: npm run build
