name: Validate extension

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore packaged Edge sandbox permissions on the hosted image
        shell: bash
        run: |
          set -euo pipefail
          edge_sandbox=/opt/microsoft/msedge/msedge-sandbox
          if [[ -f "$edge_sandbox" ]]; then
            [[ "$(readlink -f "$edge_sandbox")" == "$edge_sandbox" ]]
            dpkg-query -S "$edge_sandbox" | grep -Eq '^microsoft-edge-(stable|beta|dev): '
            sudo chown root:root "$edge_sandbox"
            sudo chmod 4755 "$edge_sandbox"
            [[ "$(stat -c '%U:%G:%a' "$edge_sandbox")" == 'root:root:4755' ]]
          fi

      - name: Reject local or sensitive files
        shell: bash
        run: |
          forbidden="$(git ls-files '.captionkeeper.local.env' '*.pem')"
          if [[ -n "$forbidden" ]]; then
            echo "Local or sensitive files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find teams-captions-saver -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          node --check scripts/check-extension.mjs

      - name: Run the complete release-candidate gate
        run: npm run release:candidate

      - name: Preserve package and browser-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: development-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/prod/browser-certification.json
            dist/prod/certification-evidence/
            dist/prod/browser-package-hashes.json
            dist/prod/release-provenance.json
            dist/prod/*.cdx.json
            dist/prod/better-captionkeep-byomcp-helper-*.zip
            dist/prod/byomcp-helper-hashes.json
            dist/prod/browser-packages/
