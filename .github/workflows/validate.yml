name: Validate extension

on:
  pull_request:
  push:
    branches:
      - master
      - dev
      - qa
      - "feature/**"
      - "fix/**"
      - "release/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Classify the pinned change scope
        id: validation-route
        run: node scripts/validation-routing.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test branch promotion controls
        run: node --test tests/promotion-policy.test.cjs tests/release-promotion.test.cjs tests/validation-routing.test.cjs

      - name: Restore packaged Edge sandbox permissions on the hosted image
        shell: bash
        run: |
          set -euo pipefail
          edge_sandbox=/opt/microsoft/msedge/msedge-sandbox
          if [[ -e "$edge_sandbox" || -L "$edge_sandbox" ]]; then
            [[ -f "$edge_sandbox" && ! -L "$edge_sandbox" ]]
            [[ "$(readlink -f "$edge_sandbox")" == "$edge_sandbox" ]]
            [[ "$(dpkg-query -S "$edge_sandbox")" =~ ^microsoft-edge-(stable|beta|dev):[[:space:]]/opt/microsoft/msedge/msedge-sandbox$ ]]
            sudo chown root:root "$edge_sandbox"
            sudo chmod 4755 "$edge_sandbox"
            [[ "$(stat -c '%U:%G:%a' "$edge_sandbox")" == 'root:root:4755' ]]
          fi

      - name: Reject local or sensitive files
        shell: bash
        run: |
          forbidden="$(git ls-files '.captionkeeper.local.env' '*.pem')"
          if [[ -n "$forbidden" ]]; then
            echo "Local or sensitive files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find teams-captions-saver -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          node --check scripts/check-extension.mjs
          node --check scripts/validation-routing.mjs

      # Nonshipping control-plane edits receive real Development checks. This
      # does not change frozen-candidate inputs or any Store/release workflow.
      - name: Validate nonshipping Development changes
        if: steps.validation-route.outputs.mode == 'nonshipping'
        run: |
          npm run release:status:check
          npm run test:release
          npm run lint
          npm run audit:surfaces
          npm run security:audit
          npm run store:metadata:check

      - name: Build the administrator setup pilot
        if: steps.validation-route.outputs.mode == 'nonshipping'
        run: node scripts/build-enterprise-package.mjs output/enterprise-setup-dev

      - name: Preserve the administrator setup pilot
        if: steps.validation-route.outputs.mode == 'nonshipping'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: administrator-setup-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: output/enterprise-setup-dev/better-captionkeep-enterprise-setup.zip

      - name: Run the complete release-candidate gate
        if: steps.validation-route.outputs.mode != 'nonshipping'
        run: npm run release:candidate

      - name: Preserve package and browser-check evidence
        if: always() && steps.validation-route.outputs.mode == 'candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/prod/browser-certification.json
            dist/prod/certification-evidence/
            dist/prod/browser-package-hashes.json
            dist/prod/release-provenance.json
            dist/prod/*.cdx.json
            dist/prod/browser-packages/
