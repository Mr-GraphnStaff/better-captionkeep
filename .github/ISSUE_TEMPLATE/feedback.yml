name: Ask a question or share feedback
description: Get help, tell us what worked, or explain what could be simpler
title: "[Feedback]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Plain language is welcome. You do not need logs or a technical diagnosis.
        For a repeatable malfunction, use Bug report. [Report sensitive security or privacy problems privately](https://github.com/Mr-GraphnStaff/better-captionkeep/security/advisories/new).
        Do not post real meeting content, participants, join links, tenant/account identifiers, credentials, or raw setup receipts.
  - type: dropdown
    id: purpose
    attributes:
      label: What would you like to share?
      options:
        - I need help using Better CaptionKeep
        - I need help deploying it for my organization
        - Something worked well
        - Something was confusing or difficult
        - Another question or feedback
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Tell us about it
      description: What were you trying to do, and what would help? Use invented examples.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and browser (optional)
      description: Include the extension version and, for organization setup, the installer version if known.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed private meeting, participant, tenant, account and sign-in information.
          required: true
