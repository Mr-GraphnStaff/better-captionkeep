name: Bug report
description: Tell us what went wrong so we can reproduce and track the fix
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Better CaptionKeep. Plain language is welcome—you do not need to know the technical cause.

        Before submitting, remove real transcripts, meeting titles or links, participant names, tenant or account identifiers, credentials, and private screenshots. Invented test examples are perfect.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Briefly describe what you saw and what it stopped you from doing.
      placeholder: "For example: The Start transcription control flashes every minute during an Edge meeting."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Better CaptionKeep version
      description: If you cannot find it, enter "Unknown" or leave this blank—we still want the report.
      placeholder: "For example: 5.4.0"
  - type: dropdown
    id: provider
    attributes:
      label: Where did it happen?
      options:
        - Microsoft Teams in a browser tab
        - Microsoft Teams installed as a PWA
        - Google Meet
        - Zoom Web
        - Popup or All settings
        - Transcript viewer or History
        - Evidence Board side panel
        - Microsoft 365 transcript import
        - Store installation or update
        - Somewhere else
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/version, operating system, and anything else that may help us reproduce it.
      placeholder: "For example: Edge 141, Windows 11, Teams PWA"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: Short steps are enough. Use a test meeting and invented text.
      placeholder: |
        1. Start a test meeting
        2. Enable live captions
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional safe screenshot or diagnostic text
      description: Include it only after removing meeting, tenant, participant, account, and credential information.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed private meeting, tenant, participant, account, credential, and browser-history information.
          required: true
        - label: I searched existing issues for the same problem.
          required: false
