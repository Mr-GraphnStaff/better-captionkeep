<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coming soon · Better CaptionKeep</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(440px, 100%);
            padding: 28px;
            box-sizing: border-box;
            border: 1px solid var(--ck-border);
            border-radius: 18px;
            text-align: center;
        }
        .eyebrow { margin: 0 0 8px; color: var(--ck-primary); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
        h1 { margin: 0 0 12px; font-size: 30px; }
        p { margin: 0 auto 20px; color: var(--ck-text-muted); line-height: 1.6; }
        button {
            min-height: 42px;
            padding: 9px 18px;
            border: 1px solid var(--ck-primary);
            border-radius: 8px;
            background: var(--ck-primary);
            color: var(--ck-bg);
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }
    </style>
    <script src="theme.js" defer></script>
    <script src="platform-coming-soon.js" defer></script>
</head>
<body>
    <main>
        <p class="eyebrow">Better CaptionKeep 5.0</p>
        <h1 id="platform-name">More meetings. Same conversation.</h1>
        <p id="platform-message">Additional meeting platforms are coming soon. Microsoft Teams capture remains available today.</p>
        <button id="close-button" type="button">Back to CaptionKeep</button>
    </main>
</body>
</html>
